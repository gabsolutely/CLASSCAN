<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CLASSCAN — Classroom Monitor</title>
  <meta name="description" content="Real-time classroom headcount dashboard for the CLASSCAN intelligent monitoring system." />
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />
  
  <!-- Stylesheet -->
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- ── Header ────────────────────────────────────────────────────────── -->
  <header>
    <div class="logo">
      <div class="logo-icon">📡</div>
      <div>
        <div class="logo-name">CLASSCAN</div>
        <div class="logo-sub">Classroom Headcount Monitor</div>
      </div>
    </div>
    <div class="status-pill" id="status-pill">
      <div class="status-dot"></div>
      <span id="status-text">Disconnected</span>
    </div>
  </header>

  <!-- ── Main ──────────────────────────────────────────────────────────── -->
  <main>

    <!-- Left Column: Display & Status -->
    <div style="display:flex; flex-direction:column; gap:20px;">

      <!-- Headcount Hero -->
      <div class="card count-hero">
        <div class="count-glow" id="count-glow"></div>
        <div class="card-label">Current Occupancy</div>
        <div class="count-number" id="count-display">—</div>
        <div class="count-label">people detected</div>
      </div>

      <!-- Live Snapshot -->
      <div class="card">
        <div class="card-label">Latest Snapshot</div>
        <div class="snapshot-wrapper">
          <img id="snapshot-img" alt="Latest classroom snapshot" />
          <div class="snapshot-placeholder" id="snapshot-placeholder">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <rect x="2" y="4" width="20" height="16" rx="2"/>
              <circle cx="12" cy="12" r="3"/>
              <path d="M6 4v0a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2"/>
            </svg>
            <span>Waiting for first snapshot…</span>
          </div>
        </div>
        <div class="snapshot-meta">
          <span id="snapshot-time">—</span>
          <span id="snapshot-dims">—</span>
        </div>
      </div>

      <!-- Zone Grid -->
      <div class="card">
        <div class="card-label">Zone Occupancy (last scan)</div>
        <div class="zone-grid" id="zone-grid">
          <!-- Populated dynamically by app.js -->
        </div>
      </div>

    </div>

    <!-- Right Column: Controls & Logs -->
    <div class="panel">

      <!-- Connection Settings -->
      <div class="card">
        <div class="card-label">Pi 3B Connection</div>
        <div class="url-row">
          <input id="pi-url" class="url-input" type="text" value="http://192.168.1.100:8080"
                 placeholder="http://<pi-ip>:8080" />
          <button class="connect-btn" id="connect-btn" type="button">Connect</button>
        </div>
      </div>

      <!-- Mode Control -->
      <div class="card">
        <div class="card-label">Detection Mode</div>
        <div class="mode-row">
          <button class="mode-btn active" id="btn-sweep" type="button">Sweep</button>
          <button class="mode-btn" id="btn-zone" type="button">Zone Check</button>
        </div>
      </div>

      <!-- Zone Targeted Commands -->
      <div class="card">
        <div class="card-label">Check Specific Zone</div>
        <div class="zone-cmd-grid">
          <button class="zone-cmd-btn" type="button" data-zone="Q1">Q1</button>
          <button class="zone-cmd-btn" type="button" data-zone="Q2">Q2</button>
          <button class="zone-cmd-btn" type="button" data-zone="Q3">Q3</button>
          <button class="zone-cmd-btn" type="button" data-zone="Q4">Q4</button>
        </div>
      </div>

      <!-- Real-time Event Log -->
      <div class="card" style="flex:1;">
        <div class="card-label">Event Log</div>
        <div class="log-scroll" id="log-scroll"></div>
      </div>

    </div>
  </main>

  <!-- ── Footer ────────────────────────────────────────────────────────── -->
  <footer>
    <span>CLASSCAN · PCU-D Capstone</span>
    <span id="footer-ts">—</span>
  </footer>

  <!-- Application Logic -->
  <script src="app.js"></script>
</body>
</html>
